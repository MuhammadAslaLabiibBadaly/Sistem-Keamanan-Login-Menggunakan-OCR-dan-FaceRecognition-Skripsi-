<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Voting Pemira</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-grad: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            --accent-color: #1DB954;
            --glass-bg: rgba(255,255,255,0.95);
        }

        body{
            min-height:100vh;
            font-family:'Poppins',sans-serif;
            margin:0;
            background:var(--primary-grad);
            display:flex;
            flex-direction:column;
        }

        /* NAVBAR */
        .navbar{
            background:rgba(255,255,255,0.9);
            backdrop-filter:blur(10px);
            padding:15px 40px;
            border-bottom:1px solid rgba(0,0,0,0.05);
        }

        .navbar-brand-text{
            font-weight:700;
            font-size:1.4rem;
            background:var(--primary-grad);
            background-clip:text;
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }

        .nav-icons i{
            font-size:1.3rem;
            color:#888;
            margin-left:20px;
        }

        /* CONTENT */
        .main-content{
            flex:1;
            padding:110px 40px 40px;
        }

        .welcome{
            font-size:2rem;
            font-weight:700;
            color:white;
            margin-bottom:5px;
        }

        .subtitle{
            color:rgba(255,255,255,0.9);
            font-size:1rem;
            margin-bottom:30px;
        }

        /* CARD PASLON */
        .candidate-card{
            background:var(--glass-bg);
            border-radius:20px;
            padding:25px;
            box-shadow:0 15px 30px rgba(0,0,0,0.15);
            transition:0.3s;
            height:100%;
        }

        .candidate-card:hover{
            transform:translateY(-5px);
        }

        .candidate-title{
            font-size:18px;
            font-weight:600;
            color:#666;
            margin-bottom:20px;
        }

        .candidate-content{
            display:flex;
            align-items:center;
            gap:25px;
        }

        .candidate-img{
            width:160px;
            height:160px;
            object-fit:cover;
            border-radius:50%;
            border:5px solid #eef2ff;
        }

        .candidate-info{
            flex:1;
        }

        .candidate-info h2{
            font-size:2rem;
            font-weight:700;
            color:#333;
            margin-bottom:5px;
        }

        .candidate-info p{
            color:#777;
            font-size:1rem;
            margin-bottom:25px;
        }

        /* BUTTON */
        .btn-vote{
            background:var(--accent-color);
            border:none;
            color:white;
            width:200px;
            height:50px;
            border-radius:50px;
            font-weight:600;
            box-shadow:0 8px 15px rgba(29,185,84,.2);
            transition:.3s;
        }

        .btn-vote:hover{
            background:#18a34a;
            transform:translateY(-2px);
            box-shadow:0 12px 20px rgba(29,185,84,.3);
        }

        /* FOOTER */
        footer{
            background:white;
            height:70px;
            display:flex;
            justify-content:center;
            align-items:center;
            color:#777;
            font-size:.9rem;
            border-top:1px solid rgba(0,0,0,.05);
        }
    </style>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
          <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
rel="stylesheet">
</head>

<body>

    <div class="navbar">
        <div class="navbar-brand-text">
            E-Voting Pemira
        </div>

        <div class="nav-icons">
            <i class="fa-solid fa-bell"></i>
            <i class="fa-solid fa-circle-user"></i>
        </div>
    </div>

    <!-- Content -->
    <div class="main-content">

        <h1 class="welcome">
            Halo, {{ nama_mahasiswa }}
        </h1>

        <div class="subtitle">
            Silahkan Pilih Kandidat
        </div>

        <form action="/submit_vote" method="POST">

            <div class="row g-4">

                <!-- Kandidat 1 -->
                <div class="col-lg-6">
                    <div class="candidate-card">

                        <div class="candidate-title">
                            Kandidat 01
                        </div>

                        <div class="candidate-content">

                            <img src="{{ url_for('static', filename='img/paslon1.png') }}"
                                 class="candidate-img"
                                 onerror="this.src='https://cdn-icons-png.flaticon.com/512/149/149071.png'">

                            <div class="candidate-info">
                                <h2>Nama Paslon 1</h2>
                                <p>Prodi/Fakultas</p>

                                <button type="submit"
                                        name="kandidat"
                                        value="1"
                                        class="btn btn-primary btn-vote">
                                    Pilih
                                </button>
                            </div>

                        </div>
                    </div>
                </div>

                <!-- Kandidat 2 -->
                <div class="col-lg-6">
                    <div class="candidate-card">

                        <div class="candidate-title">
                            Kandidat 02
                        </div>

                        <div class="candidate-content">

                            <img src="{{ url_for('static', filename='img/paslon2.png') }}"
                                 class="candidate-img"
                                 onerror="this.src='https://cdn-icons-png.flaticon.com/512/149/149071.png'">

                            <div class="candidate-info">
                                <h2>Nama Paslon 2</h2>
                                <p>Prodi/Fakultas</p>

                                <button type="submit"
                                        name="kandidat"
                                        value="2"
                                        class="btn btn-primary btn-vote">
                                    Pilih
                                </button>
                            </div>

                        </div>
                    </div>
                </div>

            </div>

        </form>

    </div>

    <footer>
    <i class="fa-regular fa-copyright me-2"></i>
    2025 Komisi Pemilihan Raya Mahasiswa • Universitas Nusantara PGRI Kediri
</footer>

</body>
</html>
