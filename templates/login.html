<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - E-Voting Pemira</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-grad: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            --accent-color: #1DB954;
            --glass-bg: rgba(255, 255, 255, 0.95);
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        /* --- Navbar Style --- */
        .navbar {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .navbar-brand-text {
            font-weight: 700;
            font-size: 1.4rem;
            background: var(--primary-grad);
            background-clip: text; 
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-icons i {
            font-size: 1.3rem;
            color: #888;
            margin-left: 20px;
        }

        /* --- Container & Card --- */
        .main-container {
            background: var(--primary-grad);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 20px;
        }

        .login-card {
            background: var(--glass-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            text-align: center;
            animation: fadeInScale 0.8s ease-out;
        }

        .login-card h2 { font-weight: 700; color: #333; margin-bottom: 10px; }
        .login-card p { color: #777; font-size: 0.9rem; margin-bottom: 30px; }

        /* --- Form Elements --- */
        .form-label { font-weight: 600; display: block; text-align: left; color: #555; margin-bottom: 8px; }
        .form-control {
            border-radius: 12px;
            padding: 12px 15px;
            border: 2px solid #eee;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        .form-control:focus { border-color: #0072ff; box-shadow: 0 0 0 4px rgba(0, 114, 255, 0.1); outline: none; }

        .btn-submit {
            background-color: var(--accent-color);
            color: white;
            padding: 12px;
            border-radius: 50px;
            font-weight: 600;
            width: 100%;
            border: none;
            text-transform: uppercase;
            box-shadow: 0 8px 15px rgba(29, 185, 84, 0.2);
            transition: 0.3s;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 12px 20px rgba(29, 185, 84, 0.3); }

        /* --- Loading Overlay Style --- */
        #loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .loading-box {
            background: white;
            padding: 30px 50px;
            border-radius: 20px;
            text-align: center;
        }
        .custom-spinner {
            width: 40px; height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0072ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeInScale { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        footer {
            background-color: white; height: 70px;
            display: flex; justify-content: center; align-items: center;
            font-size: 0.9rem; color: #777;
            position: fixed; bottom: 0; width: 100%;
            border-top: 1px solid rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="loading-box">
            <div class="custom-spinner"></div>
            <h5 class="fw-bold text-dark mb-1">Memproses Login...</h5>
            <p class="text-muted small mb-0">Memeriksa Database Mahasiswa</p>
        </div>
    </div>

    <div class="navbar">
        <div class="navbar-brand-text">E-Voting Pemira</div>
        <div class="nav-icons">
            <i class="fa-solid fa-bell" title="Notifikasi"></i>
            <i class="fa-solid fa-circle-user" title="Profil"></i>
        </div>
    </div>

    <div class="main-container">
        <div class="login-card">
            <h2>Masuk Akun</h2>
            <p>Silakan masukkan identitas mahasiswa Anda</p>

            {% if error %}
            <div class="alert alert-danger py-2 small mb-3">
                <i class="fa-solid fa-triangle-exclamation me-2"></i> {{ error }}
            </div>
            {% endif %}

            <form id="login-form" action="/login" method="POST">
                <div class="mb-3">
                    <label class="form-label">NPM (Nomor Pokok Mahasiswa)</label>
                    <input type="number" name="npm" class="form-control" placeholder="Contoh: 221302XXXX" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Kata Sandi</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-submit" id="btn-login">Login Ke Sistem</button>
            </form>
        </div>
    </div>

    <footer>
        <i class="fa-regular fa-copyright me-2"></i> 2025 Komisi Pemilihan Raya Mahasiswa • Universitas Nusantara PGRI Kediri
    </footer>

    <script>
        const loginForm = document.getElementById('login-form');
        const loadingOverlay = document.getElementById('loading-overlay');
        const btnLogin = document.getElementById('btn-login');

        loginForm.addEventListener('submit', function() {
            // Tampilkan loading overlay
            loadingOverlay.style.display = 'flex';
            // Nonaktifkan tombol agar tidak double click
            btnLogin.disabled = true;
            btnLogin.innerHTML = "Harap Tunggu...";
        });
    </script>

</body>
</html>
