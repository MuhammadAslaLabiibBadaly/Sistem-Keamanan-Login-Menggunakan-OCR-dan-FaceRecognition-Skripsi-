<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Wajah - E-Voting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-grad: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            --accent-color: #1DB954;
        }

        body, html {
            background-color: #f4f7f6;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding-top: 35px;
        }

        /* --- Navbar Style (Disamakan dengan index.html) --- */
        .navbar {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px); /* Efek blur kaca */
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            position: fixed; /* Menempel di atas */
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .navbar-brand-text {
            font-weight: 700;
            font-size: 1.4rem;
            background: var(--primary-grad);
            /* Tambahkan baris standar ini */
            background-clip: text; 
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-icons i {
            font-size: 1.3rem;
            color: #888;
            margin-left: 20px;
        }

        .nav-icons i:hover {
            color: #0072ff;
            transform: scale(1.1);
        }

        .scan-card {
            border-radius: 20px; border: none;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            overflow: hidden; 
            margin-top: 0.5px; 
            margin-bottom: 100px;
        }

        /* 2. Kurangi padding di bagian header kartu */
        .scan-card .p-4:first-child {
            padding-top: 1.5rem !important;
            padding-bottom: 1rem !important;
        }

        /* Camera Styling dengan Lingkaran Panduan */
        .camera-container {
            position: relative;
            width: 100%; height: 350px;
            background: #000;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        #video { width: 100%; height: 100%; object-fit: cover; }

        .face-guide {
            position: absolute;
            width: 220px; height: 280px;
            border: 4px solid #fff;
            border-radius: 50%; /* Oval untuk wajah */
            box-shadow: 0 0 0 1000px rgba(0,0,0,0.6);
            z-index: 10;
        }

        .btn-verify {
            background: var(--primary-grad);
            color: white; border: none;
            padding: 12px 50px; border-radius: 50px;
            font-weight: 600; width: 70%;
            margin: 10px auto; display: block;
            box-shadow: 0 8px 20px rgba(0, 114, 255, 0.3);
            transition: 0.3s;
        }

        .btn-verify:hover { transform: translateY(-3px); color: white; }

        /* Overlay Loading */
        #loading-overlay {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
            z-index: 9999; justify-content: center; align-items: center;
        }

        .loading-box { background: white; padding: 30px; border-radius: 20px; text-align: center; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #0072ff; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        footer {
            background-color: white; height: 70px;
            display: flex; justify-content: center; align-items: center;
            font-size: 0.9rem; color: #777;
            position: fixed; bottom: 0; width: 100%;
            border-top: 1px solid rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="loading-box">
            <div class="spinner"></div>
            <h5 class="fw-bold mb-1">Memverifikasi Biometrik...</h5>
            <p class="text-muted small mb-0">Membandingkan wajah dengan data KTM</p>
        </div>
    </div>

    <div class="navbar">
        <div class="navbar-brand-text">E-Voting Pemira</div>
        <div class="nav-icons text-secondary"><i class="fa-solid fa-bell"></i><i class="fa-solid fa-circle-user"></i></div>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card scan-card">
                    <div class="p-4 text-center">
                        <h4 class="fw-bold">Langkah 3: Verifikasi Wajah</h4>
                        <p class="text-muted small">Posisikan wajah Anda tepat di dalam area lingkaran.</p>
                    </div>

                    <div class="camera-container">
                        <video id="video" autoplay playsinline></video>
                        <div class="face-guide"></div>
                    </div>

                    <div class="p-4">
                        <p id="status" class="text-danger text-center small fw-bold"></p>
                        <button onclick="verifikasi()" id="btn-action" class="btn-verify">
                            <i class="fa-solid fa-face-viewfinder me-2"></i> Verifikasi Sekarang
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <i class="fa-regular fa-copyright me-2"></i> 2025 Komisi Pemilihan Raya Mahasiswa • UNP Kediri
    </footer>

    <script>
        const video = document.getElementById("video");
        const statusTxt = document.getElementById("status");
        const overlay = document.getElementById("loading-overlay");

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
        .then(stream => { video.srcObject = stream; })
        .catch(err => { alert("Kamera tidak dapat diakses"); });

        function verifikasi() {
            overlay.style.display = "flex";
            statusTxt.innerText = "";

            const canvas = document.createElement("canvas");
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(video, 0, 0);

            const imageData = canvas.toDataURL("image/jpeg", 0.6);

            fetch("/api_verifikasi_wajah", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ image: imageData })
            })
            .then(res => res.json())
            .then(data => {
                overlay.style.display = "none";
                if(data.status === "success") {
                    window.location.href = "/bilik-suara";
                } else {
                    statusTxt.innerText = data.message;
                }
            })
            .catch(err => {
                overlay.style.display = "none";
                statusTxt.innerText = "Terjadi kesalahan koneksi";
            });
        }
    </script>
</body>
</html>
