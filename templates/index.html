<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Voting Pemira</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-grad: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%); /* Gradasi Biru Modern */
            --secondary-color: #f4f7f6;
            --accent-color: #1DB954; /* Hijau Spotify untuk CTA */
            --text-dark: #2c3e50;
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Poppins', sans-serif; /* Font lebih estetik */
            overflow: hidden; /* Mencegah scrollbar muncul karena elemen dekoratif */
        }

        /* --- Navbar Style (Glassmorphism effect) --- */
        .navbar {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px); /* Efek blur kaca */
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            position: fixed; /* Menempel di atas */
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .navbar-brand-text {
            font-weight: 700;
            font-size: 1.4rem;
            background: var(--primary-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent; /* Teks Gradasi */
        }

        .nav-icons i {
            font-size: 1.3rem;
            color: #888;
            margin-left: 20px;
            transition: 0.3s;
            cursor: pointer;
        }

        .nav-icons i:hover {
            color: #0072ff;
            transform: scale(1.1);
        }

        /* --- Hero Section (Modern Style) --- */
        .hero {
            background: var(--primary-grad);
            height: 100vh; /* Full layar */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 0 20px;
            position: relative;
        }

        /* Elemen Dekoratif Lingkaran Berdenyut */
        .circle-deco {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: pulse 4s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.1; }
            50% { transform: scale(1.1); opacity: 0.2; }
            100% { transform: scale(1); opacity: 0.1; }
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: -1px;
            animation: fadeInUp 1s ease-out; /* Animasi masuk */
        }

        .hero p {
            font-size: 1.2rem;
            font-weight: 300;
            max-width: 600px;
            margin-bottom: 40px;
            opacity: 0.9;
            animation: fadeInUp 1s ease-out 0.3s backwards; /* Delay animasi */
        }

        /* --- Button Style (Pill-shaped with Shadow) --- */
        .btn-login {
            background-color: var(--accent-color);
            color: white;
            padding: 15px 80px;
            border-radius: 50px; /* Sangat lonjong */
            font-weight: 600;
            text-decoration: none;
            text-uppercase: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border: none;
            box-shadow: 0 10px 20px rgba(29, 185, 84, 0.3); /* Bayangan hijau soft */
            animation: fadeInUp 1s ease-out 0.6s backwards;
        }

        .btn-login:hover {
            background-color: #17a34a;
            color: white;
            transform: translateY(-3px) scale(1.03); /* Sedikit terangkat saat hover */
            box-shadow: 0 15px 25px rgba(29, 185, 84, 0.4);
        }

        /* --- Footer Style --- */
        footer {
            background-color: white;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.9rem;
            color: #777;
            position: fixed;
            bottom: 0;
            width: 100%;
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        /* --- Keyframes Animasi --- */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="navbar-brand-text">E-Voting Pemira</div>
        <div class="nav-icons">
            <i class="fa-solid fa-bell" title="Notifikasi"></i>
            <i class="fa-solid fa-circle-user" title="Profil"></i>
        </div>
    </div>

    <div class="hero">
        <div class="circle-deco" style="width: 300px; height: 300px; top: 10%; left: -5%;"></div>
        <div class="circle-deco" style="width: 200px; height: 200px; bottom: 15%; right: -3%; animation-delay: 2s;"></div>

        <h1>Selamat Datang</h1>
        <p>Gunakan hak pilih Anda secara jujur dan adil. Silakan tekan Login untuk melakukan Verifikasi Identitas Anda.</p>
        <a href="{{ url_for('login') }}" class="btn-login">Login</a>
    </div>

    <footer>
        <i class="fa-regular fa-copyright me-2"></i> 2025 Komisi Pemilihan Raya Mahasiswa • Universitas Nusantara PGRI Kediri
    </footer>

</body>
</html>
